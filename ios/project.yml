name: PlanSaver
options:
  bundleIdPrefix: com.obliprabu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  PlanSaver:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PlanSaver
      - path: ../deals-data/catalog.json # bundled copy: offline fallback for the Insurance/Phones/Cars tabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obliprabu.plansaver
        # Kept in sync with Android's versionName/versionCode (app/build.gradle.kts).
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "PS8DGXJ8S8"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: PlanSaver/Info.plist
    info:
      path: PlanSaver/Info.plist
      properties:
        CFBundleDisplayName: PlanSaver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Allowed in every orientation and not full-screen-only, so the app can use the whole
        # inner screen of a foldable (the iPhone Duo) instead of sitting in a portrait strip.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

name: Deals robot

on:
  schedule:
    - cron: "0 * * * *" # asks for hourly; GitHub decides, in practice it can run later or less often
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deals-robot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cp deals-data/deals.json /tmp/old-data.json
      - run: python tools/refresh_deals.py
      - name: Validate before commit (fails the job so nothing is pushed)
        run: python tools/validate_data.py deals-data/deals.json /tmp/old-data.json
      - name: Commit if changed
        run: |
          if ! git diff --quiet deals-data/deals.json; then
            git config user.name "plansaver-robot"
            git config user.email "plansaver-robot@users.noreply.github.com"
            git add deals-data/deals.json
            git commit -m "Refresh deals"
            git pull --rebase -q
            git push
          fi

name: Refresh deals

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes; GitHub cron is best-effort and often runs late
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/refresh_deals.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet deals-data/deals.json; then
            git config user.name "plansaver-robot"
            git config user.email "plansaver-robot@users.noreply.github.com"
            git add deals-data/deals.json
            git commit -m "Refresh deals"
            git push
          fi

name: Catalog robot

on:
  schedule:
    - cron: "*/30 * * * *" # asks for every 30 minutes; GitHub decides, in practice much less often
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-robot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/refresh_catalog.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet deals-data/catalog.json; then
            git config user.name "plansaver-robot"
            git config user.email "plansaver-robot@users.noreply.github.com"
            git add deals-data/catalog.json
            git commit -m "Refresh catalog"
            git pull --rebase -q
            git push
          fi
